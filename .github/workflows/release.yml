name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Versions match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p "require('./package.json').version")" = "$version"
          grep -qx "version = \"$version\"" jetbrains/build.gradle.kts
      - run: npm ci
      - run: npm run package
      - run: ./gradlew test buildPlugin verifyPlugin
        working-directory: jetbrains
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            project-tiles-*.vsix
            jetbrains/build/distributions/*.zip
          if-no-files-found: error

  vscode-marketplace:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: packages
      - run: npx vsce publish --packagePath project-tiles-${GITHUB_REF_NAME#v}.vsix --oidc

  open-vsx:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: packages
      - name: Create the namespace (no-op once it exists)
        run: npx ovsx create-namespace dominikmech || echo "Namespace dominikmech already exists"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - run: npx ovsx publish project-tiles-${GITHUB_REF_NAME#v}.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  jetbrains-marketplace:
    needs: build
    if: vars.PUBLISH_JETBRAINS == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew publishPlugin
        working-directory: jetbrains
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages
      - name: Release notes from CHANGELOG.md
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" project-tiles-*.vsix jetbrains/build/distributions/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
